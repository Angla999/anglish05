<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Spökhus</title>
  <script type="module" src="./house.js"></script>
  <link rel="stylesheet" href="inlamningfyra.css">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>
</head>

<body class="detail-page">

<header>
  <h1>Spökhusbyrån</h1>
  <h3>Bokning</h3>
</header>

<nav>
  <a href="index.html" class="back-btn">← Tillbaka till alla hus</a>
</nav>

<main>

  <section id="house"></section>

  <section id="karta"></section>

  <section id="booking">
    <h2>Boka ditt spökhus</h2>

    <form id="bookingForm">

      <label>
        Incheckning:
        <input type="date" id="date" required>
      </label>

      <label>
        Antal dagar:
        <input type="number" id="days" min="1" required>
      </label>

      <fieldset>
        <legend>Tillägg</legend>

        <label>
          <input type="checkbox" class="addon" value="150">
          Frukost (+150 kr/dag)
        </label>

        <label>
          <input type="checkbox" class="addon" value="200">
          Guidad tur (+200 kr)
        </label>

        <label>
          <input type="checkbox" class="addon" value="800">
          Spökjakt med utrustning (+800 kr)
        </label>
      </fieldset>

      <label>
        Kampanjkod:
        <input type="text" id="code" placeholder="t.ex. GHOST20">
      </label>

      <p id="total">Total: 0 kr</p>

      <button type="submit">Boka</button>

    </form>

    <div id="confirmation"></div>
  </section>

</main>

<footer>
  <p>© 2026 Spökhusbyrån AB</p>
</footer>

</body>
</html>
